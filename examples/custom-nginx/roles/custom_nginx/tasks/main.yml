---
- name: Ensure target is a supported Linux host
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_service_mgr == "systemd"
    fail_msg: "이 예제 role은 systemd를 사용하는 Linux 서버를 대상으로 합니다."

- name: Resolve build packages for this OS family
  ansible.builtin.set_fact:
    nginx_custom_build_packages_resolved: >-
      {{ nginx_custom_build_packages[ansible_os_family]
         | default(nginx_custom_build_packages['RedHat']) }}

- name: Ensure build root exists
  ansible.builtin.file:
    path: "{{ nginx_custom_build_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install build dependencies from configured repositories
  ansible.builtin.package:
    name: "{{ nginx_custom_build_packages_resolved }}"
    state: present
  when: nginx_custom_dependency_install_mode == "repo"

- name: Ensure offline dependency package directory exists
  ansible.builtin.file:
    path: "{{ nginx_custom_dependency_package_remote_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nginx_custom_dependency_install_mode == "local_files"

- name: Require local package files for offline dependency install
  ansible.builtin.assert:
    that:
      - nginx_custom_dependency_package_files | length > 0
    fail_msg: "nginx_custom_dependency_install_mode=local_files이면 nginx_custom_dependency_package_files에 rpm/deb 파일 목록이 필요합니다."
  when: nginx_custom_dependency_install_mode == "local_files"

- name: Copy offline dependency packages to target
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nginx_custom_dependency_package_remote_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_custom_dependency_package_files }}"
  register: nginx_custom_copied_dependency_packages
  when: nginx_custom_dependency_install_mode == "local_files"

- name: Install offline dependency packages
  ansible.builtin.package:
    name: "{{ nginx_custom_copied_dependency_packages.results | map(attribute='dest') | list }}"
    state: present
  when: nginx_custom_dependency_install_mode == "local_files"

- name: Ensure nginx group exists
  ansible.builtin.group:
    name: "{{ nginx_custom_group }}"
    system: true
    state: present

- name: Ensure nginx user exists
  ansible.builtin.user:
    name: "{{ nginx_custom_user }}"
    group: "{{ nginx_custom_group }}"
    system: true
    shell: "{{ nginx_custom_user_shell }}"
    home: "{{ nginx_custom_prefix }}"
    create_home: false
    state: present

- name: Create custom nginx directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - path: "{{ nginx_custom_prefix }}"
    - path: "{{ nginx_custom_prefix }}/conf"
    - path: "{{ nginx_custom_prefix }}/conf/conf.d"
    - path: "{{ nginx_custom_prefix }}/html"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"
    - path: "{{ nginx_custom_prefix }}/logs"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"
    - path: "{{ nginx_custom_prefix }}/client_body_temp"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"
    - path: "{{ nginx_custom_prefix }}/proxy_temp"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"
    - path: "{{ nginx_custom_prefix }}/fastcgi_temp"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"
    - path: "{{ nginx_custom_prefix }}/uwsgi_temp"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"
    - path: "{{ nginx_custom_prefix }}/scgi_temp"
      owner: "{{ nginx_custom_user }}"
      group: "{{ nginx_custom_group }}"

- name: Check installed custom nginx version marker
  ansible.builtin.stat:
    path: "{{ nginx_custom_prefix }}/.nginx-version"
  register: nginx_custom_version_marker

- name: Read installed custom nginx version marker
  ansible.builtin.slurp:
    path: "{{ nginx_custom_prefix }}/.nginx-version"
  register: nginx_custom_version_marker_content
  when: nginx_custom_version_marker.stat.exists

- name: Decide whether nginx must be built
  ansible.builtin.set_fact:
    nginx_custom_needs_build: >-
      {{ nginx_custom_force_rebuild
         or not nginx_custom_version_marker.stat.exists
         or ((nginx_custom_version_marker_content.content | default('') | b64decode | trim) != nginx_custom_version) }}

- name: Copy local nginx source tarball to target
  ansible.builtin.copy:
    src: "{{ nginx_custom_source_archive }}"
    dest: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}.tar.gz"
    owner: root
    group: root
    mode: "0644"
  when:
    - nginx_custom_needs_build
    - nginx_custom_source_archive | length > 0

- name: Download nginx source tarball
  ansible.builtin.get_url:
    url: "{{ nginx_custom_download_url }}"
    dest: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}.tar.gz"
    mode: "0644"
  when:
    - nginx_custom_needs_build
    - nginx_custom_source_archive | length == 0

- name: Extract nginx source
  ansible.builtin.unarchive:
    src: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}.tar.gz"
    dest: "{{ nginx_custom_build_root }}"
    remote_src: true
    creates: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}"
  when: nginx_custom_needs_build

- name: Configure nginx source build
  ansible.builtin.command:
    cmd: "./configure {{ nginx_custom_configure_flags | join(' ') }}"
    chdir: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}"
    creates: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}/Makefile"
  when: nginx_custom_needs_build

- name: Build nginx from source
  ansible.builtin.command:
    cmd: "make -j {{ ansible_processor_vcpus | default(2) }}"
    chdir: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}"
  changed_when: nginx_custom_needs_build
  when: nginx_custom_needs_build

- name: Install nginx into custom prefix
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ nginx_custom_build_root }}/nginx-{{ nginx_custom_version }}"
  changed_when: nginx_custom_needs_build
  when: nginx_custom_needs_build
  notify: restart custom nginx

- name: Write installed nginx version marker
  ansible.builtin.copy:
    dest: "{{ nginx_custom_prefix }}/.nginx-version"
    content: "{{ nginx_custom_version }}\n"
    owner: root
    group: root
    mode: "0644"
  when: nginx_custom_needs_build

- name: Deploy nginx main config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_custom_prefix }}/conf/nginx.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ nginx_custom_prefix }}/sbin/nginx -t -c %s"
  notify: reload custom nginx

- name: Deploy default server config
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ nginx_custom_prefix }}/conf/conf.d/default.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload custom nginx

- name: Validate custom nginx configuration
  ansible.builtin.command:
    cmd: "{{ nginx_custom_prefix }}/sbin/nginx -t -c {{ nginx_custom_prefix }}/conf/nginx.conf"
  changed_when: false

- name: Deploy default index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_custom_prefix }}/html/index.html"
    owner: "{{ nginx_custom_user }}"
    group: "{{ nginx_custom_group }}"
    mode: "0644"

- name: Install custom nginx systemd unit
  ansible.builtin.template:
    src: nginx-custom.service.j2
    dest: "/etc/systemd/system/{{ nginx_custom_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart custom nginx

- name: Install logrotate config for custom nginx
  ansible.builtin.template:
    src: nginx-custom-logrotate.j2
    dest: "/etc/logrotate.d/{{ nginx_custom_service_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

- name: Enable and start custom nginx
  ansible.builtin.systemd:
    name: "{{ nginx_custom_service_name }}"
    enabled: true
    state: started

- name: Check custom nginx health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_custom_port }}/"
    status_code: 200
  register: nginx_custom_health
  retries: 3
  delay: 2
  until: nginx_custom_health.status == 200
